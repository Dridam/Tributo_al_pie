<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mapa Interactivo</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    html, body { 
      margin: 0; padding: 0; width: 100%; height: 100%; 
      overflow: hidden; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    }
    
    #map { width: 100vw; height: 100vh; touch-action: pan-x pan-y; }
    
    .leaflet-popup-content-wrapper { padding: 8px; border-radius: 8px; }
    .leaflet-popup-content { width: 250px !important; margin: 8px; }

    .popup-content { 
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    /* Contenedor de imagen general */
    .img-container {
      width: 100%;
      max-width: 250px;
      height: 200px;
      background-color: #f0f0f0;
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Modificadores de encuadre específico */
    .img-container img.img-top {
      object-position: top center; /* Muestra la parte superior (Castuera) */
    }

    .img-container img.img-bottom {
      object-position: bottom center; /* Recorta la mitad superior (Quart) */
    }

    /* CARRUSEL PARA MÚLTIPLES FOTOS */
    .carousel-wrapper {
      position: relative;
      width: 100%;
      max-width: 250px;
      height: 200px;
      overflow: hidden;
      border-radius: 6px;
      background-color: #f0f0f0;
    }

    .carousel-track {
      display: flex;
      width: 100%;
      height: 100%;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none; 
    }
    .carousel-track::-webkit-scrollbar { display: none; }

    .carousel-slide {
      flex: 0 0 100%;
      height: 100%;
      scroll-snap-align: start;
    }

    .carousel-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .carousel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.5);
      color: white;
      border: none;
      font-size: 14px;
      padding: 6px 10px;
      cursor: pointer;
      border-radius: 50%;
      z-index: 10;
      user-select: none;
    }
    .carousel-btn.prev { left: 4px; }
    .carousel-btn.next { right: 4px; }
  </style>
</head>
<body>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map', { tap: true }).setView([39.8, -3.0], 6);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // Icono Grande (75x50)
    const defaultIcon = L.icon({
      iconUrl: 'logo.png',   
      iconSize: [75, 50],    
      iconAnchor: [37, 25],  
      popupAnchor: [0, -25]  
    });

    // Icono Mediano (60x40)
    const smallIcon = L.icon({
      iconUrl: 'logo.png',   
      iconSize: [60, 40],    
      iconAnchor: [30, 20],  
      popupAnchor: [0, -20]  
    });

    const cacheBuster = '?v=' + new Date().getTime();

    // Configuración de las ubicaciones y sus clases de encuadre si aplica
    const ubicaciones = [
      { coords: [40.7126, -4.1738], fotos: ["pies_colmenar.jpg" + cacheBuster], esPequeño: true }, // San Rafael
      { coords: [40.6008, -3.7081], fotos: ["pies_tres.jpg" + cacheBuster], esPequeño: true },     // Tres Cantos
      { coords: [40.0471, -3.0504], fotos: ["pies_belinchon.jpg" + cacheBuster], esPequeño: true }, // Belinchón
      { coords: [39.3892, -3.2081], fotos: ["pies_alcazar.jpg" + cacheBuster], esPequeño: false }, // Alcázar
      { coords: [39.4831, -0.4431], fotos: ["pies_quart.jpeg" + cacheBuster], esPequeño: false, fitClass: "img-bottom" }, // Quart (recorta arriba)
      { coords: [39.5696, 2.6502],  fotos: ["pies_palma.jpg" + cacheBuster], esPequeño: false },   // Palma
      { coords: [37.8882, -4.7794], fotos: ["pies_cordoba.jpg" + cacheBuster], esPequeño: false }, // Córdoba
      { coords: [41.6079, 2.2876],  fotos: ["pies_granollers.jpeg" + cacheBuster], esPequeño: false }, // Granollers
      { coords: [38.7231, -5.5444], fotos: ["pies_castuera.jpg" + cacheBuster], esPequeño: false, fitClass: "img-top" }   // Castuera (enfoca arriba)
    ];

    ubicaciones.forEach((punto, index) => {
      let popupHtml = '<div class="popup-content">';

      if (punto.fotos && punto.fotos.length > 1) {
        const carouselId = `carousel-${index}`;
        popupHtml += `
          <div class="carousel-wrapper">
            <button class="carousel-btn prev" onclick="moverCarrusel('${carouselId}', -1)">&#10094;</button>
            <div class="carousel-track" id="${carouselId}">
        `;
        
        punto.fotos.forEach(foto => {
          popupHtml += `
            <div class="carousel-slide">
              <img src="${foto}" class="${punto.fitClass || ''}" alt="Foto" onload="actualizarPopup(this)">
            </div>
          `;
        });

        popupHtml += `
            </div>
            <button class="carousel-btn next" onclick="moverCarrusel('${carouselId}', 1)">&#10095;</button>
          </div>
        `;
      } 
      else if (punto.fotos && punto.fotos.length === 1) {
        popupHtml += `
          <div class="img-container">
            <img src="${punto.fotos[0]}" class="${punto.fitClass || ''}" alt="Foto" onload="actualizarPopup(this)">
          </div>
        `;
      }

      popupHtml += '</div>';

      const iconoUsar = punto.esPequeño ? smallIcon : defaultIcon;

      L.marker(punto.coords, { icon: iconoUsar })
       .addTo(map)
       .bindPopup(popupHtml, { autoPanPadding: [20, 20] });
    });

    function moverCarrusel(carouselId, direccion) {
      const track = document.getElementById(carouselId);
      if (track) {
        const slideWidth = track.clientWidth;
        track.scrollBy({ left: slideWidth * direccion, behavior: 'smooth' });
      }
    }

    function actualizarPopup(imgElement) {
      if (map) {
        map.eachLayer(layer => {
          if (layer.getPopup && layer.getPopup() && layer.isPopupOpen()) {
            layer.getPopup().update();
          }
        });
      }
    }
  </script>
</body>
</html>
