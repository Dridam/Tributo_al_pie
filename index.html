<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa Interactivo</title>
  <!-- CSS de Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; padding: 0; font-family: sans-serif; }
    #map { width: 100vw; height: 100vh; }
    /* Estilos de los elementos dentro del desplegable */
    .popup-content img { width: 100%; max-width: 260px; border-radius: 6px; display: block; margin-bottom: 8px; }
    .popup-content iframe { width: 100%; max-width: 260px; height: 145px; border: 0; display: block; }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- JS de Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // 1. Centrar el mapa en la Península e Islas Baleares
    const map = L.map('map').setView([39.8, -3.0], 6);

    // 2. Capa base de mapa (OpenStreetMap)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // 3. Icono personalizado con 'logo.png'
    const customIcon = L.icon({
      iconUrl: 'logo.png',   // Nombre exacto del archivo subido a GitHub junto a index.html
      iconSize: [60, 40],    // Ancho y alto en píxeles
      iconAnchor: [30, 20],  // Punto de anclaje (centro del icono)
      popupAnchor: [0, -20]  // Posición de la ventana flotante respecto al icono
    });

    // 4. Tus 10 ubicaciones exactas
    const ubicaciones = [
      {
        coords: [40.4168, -3.7038], // Madrid
        foto: "URL_DE_TU_FOTO_1",
        videoUrl: "URL_DE_EMBED_YOUTUBE_1"
      },
      {
        coords: [40.3528, -3.5350], // Rivas-Vaciamadrid
        foto: "URL_DE_TU_FOTO_2",
        videoUrl: "URL_DE_EMBED_YOUTUBE_2"
      },
      {
        coords: [39.3892, -3.2081], // Alcázar de San Juan
        foto: "URL_DE_TU_FOTO_3",
        videoUrl: "URL_DE_EMBED_YOUTUBE_3"
      },
      {
        coords: [39.4831, -0.4431], // Quart de Poblet
        foto: "URL_DE_TU_FOTO_4",
        videoUrl: "URL_DE_EMBED_YOUTUBE_4"
      },
      {
        coords: [40.6008, -3.7081], // Tres Cantos
        foto: "URL_DE_TU_FOTO_5",
        videoUrl: "URL_DE_EMBED_YOUTUBE_5"
      },
      {
        coords: [39.5696, 2.6502], // Palma de Mallorca
        foto: "URL_DE_TU_FOTO_6",
        videoUrl: "URL_DE_EMBED_YOUTUBE_6"
      },
      {
        coords: [37.8882, -4.7794], // Córdoba
        foto: "URL_DE_TU_FOTO_7",
        videoUrl: "URL_DE_EMBED_YOUTUBE_7"
      },
      {
        coords: [41.6079, 2.2876], // Granollers
        foto: "URL_DE_TU_FOTO_8",
        videoUrl: "URL_DE_EMBED_YOUTUBE_8"
      },
      {
        coords: [40.6586, -3.7663], // Colmenar Viejo
        foto: "URL_DE_TU_FOTO_9",
        videoUrl: "URL_DE_EMBED_YOUTUBE_9"
      },
      {
        coords: [38.7231, -5.5444], // Castuera
        foto: "pies_castuera.jpg",  // <-- Foto asociada a Castuera
        videoUrl: "URL_DE_EMBED_YOUTUBE_10"
      }
    ];

    // 5. Dibujar marcadores con el logo personalizado
    ubicaciones.forEach(punto => {
      const popupHtml = `
        <div class="popup-content">
          <img src="${punto.foto}" alt="Imagen">
          <iframe src="${punto.videoUrl}" allowfullscreen></iframe>
        </div>
      `;
      L.marker(punto.coords, { icon: customIcon }).addTo(map).bindPopup(popupHtml);
    });
  </script>
</body>
</html>
