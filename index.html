<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa Interactivo</title>
  <!-- CSS de Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; padding: 0; font-family: sans-serif; }
    #map { width: 100vw; height: 100vh; }
    
    /* Ajuste del contenedor principal del popup */
    .leaflet-popup-content-wrapper {
      padding: 10px;
    }
    .leaflet-popup-content {
      width: auto !important;
      margin: 10px;
      min-width: 200px; /* Asegura un ancho mínimo para evitar colapsos */
    }

    /* Estilos base para el contenido flotante */
    .popup-content { 
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Imágenes con vídeo */
    .popup-content img { 
      width: 100%; 
      max-width: 320px; 
      height: auto;
      border-radius: 6px; 
      display: block; 
      margin-bottom: 8px; 
    }

    .popup-content iframe { 
      width: 100%; 
      max-width: 320px; 
      height: 180px; 
      border: 0; 
      display: block; 
    }

    /* Estilo para marcadores SOLO FOTO (Castuera y Alcázar de San Juan) */
    .popup-content img.img-grande {
      width: 100%;
      max-width: 500px; /* Tamaño amplio de la primera versión */
      min-height: 150px; /* Evita que el contenedor colapse a 0px antes de renderizar */
      height: auto;
      margin-bottom: 0;
      object-fit: contain;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- JS de Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([39.8, -3.0], 6);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    const customIcon = L.icon({
      iconUrl: 'logo.png',   
      iconSize: [90, 60],    
      iconAnchor: [45, 30],  
      popupAnchor: [0, -30]  
    });

    const cacheBuster = '?v=' + new Date().getTime();

    const ubicaciones = [
      { coords: [40.4168, -3.7038], foto: "URL_DE_TU_FOTO_1", videoUrl: "URL_DE_EMBED_YOUTUBE_1" },
      { coords: [40.3528, -3.5350], foto: "URL_DE_TU_FOTO_2", videoUrl: "URL_DE_EMBED_YOUTUBE_2" },
      {
        coords: [39.3892, -3.2081], // Alcázar de San Juan
        foto: "pies_alcazar.jpg" + cacheBuster,
        videoUrl: null 
      },
      { coords: [39.4831, -0.4431], foto: "URL_DE_TU_FOTO_4", videoUrl: "URL_DE_EMBED_YOUTUBE_4" },
      { coords: [40.6008, -3.7081], foto: "URL_DE_TU_FOTO_5", videoUrl: "URL_DE_EMBED_YOUTUBE_5" },
      { coords: [39.5696, 2.6502], foto: "URL_DE_TU_FOTO_6", videoUrl: "URL_DE_EMBED_YOUTUBE_6" },
      { coords: [37.8882, -4.7794], foto: "URL_DE_TU_FOTO_7", videoUrl: "URL_DE_EMBED_YOUTUBE_7" },
      { coords: [41.6079, 2.2876], foto: "URL_DE_TU_FOTO_8", videoUrl: "URL_DE_EMBED_YOUTUBE_8" },
      { coords: [40.6586, -3.7663], foto: "URL_DE_TU_FOTO_9", videoUrl: "URL_DE_EMBED_YOUTUBE_9" },
      {
        coords: [38.7231, -5.5444], // Castuera
        foto: "pies_castuera.jpg" + cacheBuster,
        videoUrl: null 
      }
    ];

    ubicaciones.forEach(punto => {
      let popupHtml = '';

      if (!punto.videoUrl) {
        popupHtml = `
          <div class="popup-content">
            <img src="${punto.foto}" class="img-grande" alt="Cargando imagen..." onload="actualizarPopup(this)">
          </div>
        `;
      } else {
        popupHtml = `
          <div class="popup-content">
            <img src="${punto.foto}" alt="Imagen" onload="actualizarPopup(this)">
            <iframe src="${punto.videoUrl}" allowfullscreen></iframe>
          </div>
        `;
      }

      L.marker(punto.coords, { icon: customIcon }).addTo(map).bindPopup(popupHtml);
    });

    // Función global para forzar al popup a recalcular sus dimensiones en cuanto la imagen termina de cargarse
    function actualizarPopup(imgElement) {
      const popup = imgElement.closest('.leaflet-popup');
      if (popup && map) {
        // Redibuja el popup para adaptar el tamaño exacto de la imagen cargada
        map.eachLayer(layer => {
          if (layer.getPopup && layer.getPopup() && layer.isPopupOpen()) {
            layer.getPopup().update();
          }
        });
      }
    }
  </script>
</body>
</html>
