<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mapa Interactivo</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    html, body { 
      margin: 0; padding: 0; width: 100%; height: 100%; 
      overflow: hidden; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    }
    
    #map { width: 100vw; height: 100vh; touch-action: pan-x pan-y; }
    
    .leaflet-popup-content-wrapper { padding: 8px; border-radius: 8px; }
    .leaflet-popup-content { width: auto !important; margin: 8px; max-width: 80vw !important; }

    .popup-content { 
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Imagen individual */
    .popup-content img.img-grande {
      width: 100%;
      max-width: 280px;
      max-height: 55vh;
      min-height: 120px;
      height: auto;
      object-fit: contain;
      display: block;
      border-radius: 6px;
    }

    /* CARRUSEL PARA MÚLTIPLES FOTOS */
    .carousel-wrapper {
      position: relative;
      width: 100%;
      max-width: 280px;
      overflow: hidden;
      border-radius: 6px;
    }

    .carousel-track {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none; 
    }
    .carousel-track::-webkit-scrollbar { display: none; }

    .carousel-slide {
      flex: 0 0 100%;
      scroll-snap-align: start;
    }

    .carousel-slide img {
      width: 100%;
      max-width: 280px;
      max-height: 55vh;
      min-height: 120px;
      height: auto;
      object-fit: contain;
      display: block;
    }

    .carousel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.5);
      color: white;
      border: none;
      font-size: 16px;
      padding: 4px 8px;
      cursor: pointer;
      border-radius: 50%;
      z-index: 10;
      user-select: none;
    }
    .carousel-btn.prev { left: 4px; }
    .carousel-btn.next { right: 4px; }
  </style>
</head>
<body>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map', { tap: true }).setView([39.8, -3.0], 6);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // Icono Estándar (Resto de ubicaciones)
    const defaultIcon = L.icon({
      iconUrl: 'logo.png',   
      iconSize: [60, 40],    
      iconAnchor: [30, 20],  
      popupAnchor: [0, -20]  
    });

    // Icono Pequeño (Madrid, Rivas, Colmenar Viejo y Tres Cantos)
    const smallIcon = L.icon({
      iconUrl: 'logo.png',   
      iconSize: [45, 30],    
      iconAnchor: [22, 15],  
      popupAnchor: [0, -15]  
    });

    const cacheBuster = '?v=' + new Date().getTime();

    const ubicaciones = [
      { coords: [40.4168, -3.7038], fotos: ["pies_madrid.jpg" + cacheBuster], esPequeño: true }, // Madrid
      { coords: [40.3528, -3.5350], fotos: ["pies_rivas.jpg" + cacheBuster], esPequeño: true },  // Rivas-Vaciamadrid
      { coords: [40.6586, -3.7663], fotos: ["pies_colmenar.jpg" + cacheBuster], esPequeño: true }, // Colmenar Viejo
      { coords: [40.6008, -3.7081], fotos: ["pies_tres.jpg" + cacheBuster], esPequeño: true },   // Tres Cantos
      { coords: [39.3892, -3.2081], fotos: ["pies_alcazar.jpg" + cacheBuster], esPequeño: false }, // Alcázar de San Juan
      { coords: [39.4831, -0.4431], fotos: ["pies_quart.jpeg" + cacheBuster], esPequeño: false }, // Quart de Poblet (.jpeg)
      { coords: [39.5696, 2.6502],  fotos: ["pies_palma.jpg" + cacheBuster], esPequeño: false },   // Palma de Mallorca
      { coords: [37.8882, -4.7794], fotos: ["pies_cordoba.jpg" + cacheBuster], esPequeño: false }, // Córdoba
      { coords: [41.6079, 2.2876],  fotos: ["pies_granollers.jpg" + cacheBuster], esPequeño: false }, // Granollers
      { coords: [38.7231, -5.5444], fotos: ["pies_castuera.jpg" + cacheBuster], esPequeño: false }  // Castuera
    ];

    ubicaciones.forEach((punto, index) => {
      let popupHtml = '<div class="popup-content">';

      // Si el punto tiene más de 1 foto, genera el carrusel
      if (punto.fotos && punto.fotos.length > 1) {
        const carouselId = `carousel-${index}`;
        popupHtml += `
          <div class="carousel-wrapper">
            <button class="carousel-btn prev" onclick="moverCarrusel('${carouselId}', -1)">&#10094;</button>
            <div class="carousel-track" id="${carouselId}">
        `;
        
        punto.fotos.forEach(foto => {
          popupHtml += `
            <div class="carousel-slide">
              <img src="${foto}" alt="Foto" onload="actualizarPopup(this)">
            </div>
          `;
        });

        popupHtml += `
            </div>
            <button class="carousel-btn next" onclick="moverCarrusel('${carouselId}', 1)">&#10095;</button>
          </div>
        `;
      } 
      // Si solo tiene 1 foto
      else if (punto.fotos && punto.fotos.length === 1) {
        popupHtml += `<img src="${punto.fotos[0]}" class="img-grande" alt="Foto" onload="actualizarPopup(this)">`;
      }

      popupHtml += '</div>';

      const iconoUsar = punto.esPequeño ? smallIcon : defaultIcon;

      L.marker(punto.coords, { icon: iconoUsar })
       .addTo(map)
       .bindPopup(popupHtml, { autoPanPadding: [20, 20] });
    });

    function moverCarrusel(carouselId, direccion) {
      const track = document.getElementById(carouselId);
      if (track) {
        const slideWidth = track.clientWidth;
        track.scrollBy({ left: slideWidth * direccion, behavior: 'smooth' });
      }
    }

    function actualizarPopup(imgElement) {
      if (map) {
        map.eachLayer(layer => {
          if (layer.getPopup && layer.getPopup() && layer.isPopupOpen()) {
            layer.getPopup().update();
          }
        });
      }
    }
  </script>
</body>
</html>
